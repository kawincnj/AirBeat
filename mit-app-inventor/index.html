<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirBeat - Instrument Selector</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 2rem; }
        .menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            width: 80%;
            max-width: 400px;
        }
        a {
            background-color: #333;
            color: white;
            text-decoration: none;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #444;
        }
        a:hover { 
            background-color: #007bff; 
            border-color: #0056b3;
            transform: translateY(-2px);
        }
        .piano-btn { border-left: 5px solid #00ff00; }
        .cajon-btn { border-left: 5px solid #ffaa00; }
    </style>
</head>
<body>
    <h1>AirBeat</h1>
    <div class="menu">
        <a href="instruments/cajon/index.html" class="cajon-btn">🥁 Cajon</a>
        <a href="instruments/piano/index.html" class="piano-btn">🎹 Piano</a>
        <span style="color: #666; text-align: center; margin-top: 10px;">More instruments coming soon...</span>
    </div>
</body>
</html>
